[project]
name = "assetkeep"
version = "0.1.0"
description = "Local content-addressed asset index for game development"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=10.4",
    "numpy>=2.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
    # Multipart uploads, which is how drag-and-drop import reaches the vault.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 3D parsing. trimesh alone covers GLTF/GLB/OBJ/STL/PLY with no system
# dependency; impasse binds the assimp installed by `brew install assimp` and is
# what makes FBX - 98% of real 3D content here - anything more than a filename.
model3d = ["trimesh>=4.4", "impasse>=1.0"]
# Zero-shot tagging and semantic search. onnxruntime rather than torch: an
# exported CLIP ViT-B/32 is ~350 MB against ~2 GB for a torch install, which
# decides the matter on an 8 GB machine that also runs ComfyUI.
clip = ["onnxruntime>=1.19", "tokenizers>=0.20"]
watch = ["watchdog>=5.0"]

[project.scripts]
assetkeep = "assetkeep.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# "assetkeep" is listed so --doctest-modules picks up the doctests written into
# the detection heuristics themselves, which is where their examples belong.
testpaths = ["tests", "assetkeep"]
addopts = "--doctest-modules"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assetkeep"]
